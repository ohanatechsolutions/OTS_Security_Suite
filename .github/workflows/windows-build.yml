name: OTS Security Suite — Windows build and integration checks
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ots-security-suite-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout suite and pinned dependencies
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.4'
          cache: false
      - name: Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: '10.0.x'
      - name: Validate source and Go scanner
        shell: pwsh
        run: |
          Push-Location scanner
          go version
          if ((go version) -notmatch 'go1\.27\.4') { throw 'Scanner toolchain must use patched Go 1.27.4' }
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw 'Go tests failed' }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'Go vet failed' }
          Pop-Location
          python -m compileall -q tools
          python -m unittest discover -s tools -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { throw 'Suite Python manifest tests failed' }
          node --check extension/popup.js
          if ($LASTEXITCODE -ne 0) { throw 'Chrome extension JS syntax check failed' }
          node tools/test_extension.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Chrome popup security contract tests failed' }
          foreach ($p in @('tools/sign-windows-release.ps1','tools/verify-windows-release.ps1','tools/collect-windows-qa.ps1')) {
            $tokens = $null; $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p).Path,[ref]$tokens,[ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -ne 0) { throw "Release-script parse failed: $p" }
          }
          # Verify the supplied brand PNG genuinely has transparent pixels.
          # Metadata/filename alone cannot prove the black background was removed.
          Add-Type -AssemblyName System.Drawing
          $image = [System.Drawing.Bitmap]::new((Resolve-Path 'src/OTSSecuritySuite.Desktop/OhanaLogo.png').Path)
          try {
            $hasTransparency = $false
            $dx = [Math]::Max(1, [int]([Math]::Floor($image.Width / 24)))
            $dy = [Math]::Max(1, [int]([Math]::Floor($image.Height / 24)))
            for ($x=0; $x -lt $image.Width; $x += $dx) {
              for ($y=0; $y -lt $image.Height; $y += $dy) {
                if ($image.GetPixel($x,$y).A -lt 240) { $hasTransparency = $true; break }
              }
              if ($hasTransparency) { break }
            }
            if (-not $hasTransparency) { throw 'Brand logo PNG has no transparent sampled pixels' }
            Write-Host "OTS logo PNG transparency verified ($($image.Width)x$($image.Height))"
          }
          finally { $image.Dispose() }
      - name: Build Go scanner process
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bundle/engines | Out-Null
          Push-Location scanner
          go build -trimpath -ldflags '-s -w' -o ../bundle/engines/OTSScannerEngine.exe ./cmd/scanner
          if ($LASTEXITCODE -ne 0) { throw 'Scanner build failed' }
          Pop-Location
      - name: Build W.H.I.T.E. as offline CLI
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -e modules/OTS_WHITE pyinstaller==6.16.0
          python -m PyInstaller --noconfirm --clean --onefile --console --name OTSWhiteAudit --paths modules/OTS_WHITE tools/white_entry.py
          if ($LASTEXITCODE -ne 0) { throw 'W.H.I.T.E. build failed' }
          Copy-Item dist/OTSWhiteAudit.exe bundle/engines/
          Push-Location modules/OTS_WHITE
          python -m unittest discover -s tests -p 'test_*.py'
          Pop-Location
          if ($LASTEXITCODE -ne 0) { throw 'W.H.I.T.E. tests failed' }
      - name: Offline W.H.I.T.E. source security audit (metadata only)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Resolve-Path '.').Path
          $exe = (Resolve-Path 'bundle/engines/OTSWhiteAudit.exe').Path
          # Do not print the raw scanner JSON, source snippets or secret findings
          # into public GitHub Actions logs. Offline SCA is explicitly skipped.
          $reportJson = (& $exe $root '--format' 'json' '--no-sca' '--fail-on' 'none') -join "`n"
          if ($LASTEXITCODE -ne 0) { throw 'Suite source audit was incomplete or failed; inspect privately' }
          $report = $reportJson | ConvertFrom-Json
          if (-not $report.complete -or -not $report.checks -or
              $report.scanned_files -lt 20 -or $report.errors.Count -ne 0) {
            throw 'Source audit coverage unexpectedly incomplete; inspect private report locally'
          }
          $categories = @($report.findings | Group-Object -Property severity |
            ForEach-Object { "$($_.Name):$($_.Count)" })
          Write-Host "Offline WHITE source audit complete: $($report.scanned_files) files; severity counts: $($categories -join ', ')"
          # This test covers worktree secrets/SAST only; not history, offline OSV,
          # external penetration testing or binary payload correctness.
          $global:LASTEXITCODE = 0
      - name: Exercise packaged W.H.I.T.E. against a synthetic repository
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sample = Join-Path $env:TEMP 'ots-suite-white-audit-fixture'
          New-Item -ItemType Directory -Path $sample -Force | Out-Null
          Set-Content -Path (Join-Path $sample 'hello.py') -Value "print('hello world')" -Encoding utf8
          $binary = (Resolve-Path 'bundle/engines/OTSWhiteAudit.exe').Path
          try {
            $json = (& $binary $sample '--format' 'json' '--no-sca') -join "`n"
            if ($LASTEXITCODE -ne 0) { throw 'Packaged W.H.I.T.E. returned an unexpected failure for benign synthetic code' }
            $report = $json | ConvertFrom-Json
            if (-not $report.complete -or $report.scanned_files -ne 1) {
              throw 'Packaged W.H.I.T.E. JSON contract or scanned-file count was incorrect'
            }
            $invalidJson = (& $binary $sample '--format' 'json' '--no-sca' '--history') -join "`n"
            if ($LASTEXITCODE -ne 2) { throw 'Non-git history audit should report exit code 2 (incomplete)' }
            $invalid = $invalidJson | ConvertFrom-Json
            if ($invalid.complete) { throw 'Incomplete W.H.I.T.E. audit was misreported as complete' }
            # A nonzero exit is the EXPECTED outcome above; reset it so pwsh's
            # GitHub Actions wrapper does not incorrectly mark this test step failed.
            $global:LASTEXITCODE = 0
            Write-Host 'Packaged W.H.I.T.E. successful and incomplete JSON contracts verified'
          }
          finally { Remove-Item -Path $sample -Recurse -Force -ErrorAction SilentlyContinue }
      - name: Build System Sanitizer and smoke tests
        shell: pwsh
        run: |
          dotnet run --project modules/OTS_System_Sanitizer/tests/OTSSystemSanitizer.SmokeTests/OTSSystemSanitizer.SmokeTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Sanitizer smoke tests failed' }
          dotnet publish modules/OTS_System_Sanitizer/src/OTSSystemSanitizer.Desktop/OTSSystemSanitizer.Desktop.csproj -c Release -r win-x64 --self-contained true -o bundle/engines
          if ($LASTEXITCODE -ne 0) { throw 'Sanitizer build failed' }
      - name: W.H.I.T.E. process cancellation and privacy regression tests
        shell: pwsh
        run: |
          dotnet run --project tests/OTSSecuritySuite.AuditSmoke/OTSSecuritySuite.AuditSmoke.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'W.H.I.T.E. process security smoke failed' }
      - name: Build native WPF suite host
        shell: pwsh
        run: |
          dotnet publish src/OTSSecuritySuite.Desktop/OTSSecuritySuite.Desktop.csproj -c Release -r win-x64 --self-contained true -o bundle
          if ($LASTEXITCODE -ne 0) { throw 'Suite host build failed' }
          Copy-Item -Path extension -Destination bundle/extension -Recurse -Force
          if ($LASTEXITCODE -ne 0) { throw 'Suite host build failed' }
          foreach ($path in @('bundle/OTSSecuritySuite.exe','bundle/engines/OTSWhiteAudit.exe','bundle/engines/OTSScannerEngine.exe','bundle/engines/OTSSystemSanitizer.exe')) {
            if (-not (Test-Path $path)) { throw "Missing output $path" }
          }
      - name: Preserve upstream MIT license and third-party attribution in installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force bundle/licenses | Out-Null
          $required = @(
            @('modules/OTS_WHITE/LICENSE', 'bundle/licenses/OTS_WHITE_LICENSE.txt'),
            @('modules/OTS_WHITE/THIRD_PARTY_NOTICES.md', 'bundle/licenses/OTS_WHITE_THIRD_PARTY_NOTICES.md'),
            @('modules/OTS_System_Sanitizer/LICENSE', 'bundle/licenses/OTS_System_Sanitizer_LICENSE.txt'),
            @('modules/OTS_System_Sanitizer/THIRD_PARTY_NOTICES.md', 'bundle/licenses/OTS_System_Sanitizer_THIRD_PARTY_NOTICES.md'),
            @('scanner/NOTICE.md', 'bundle/licenses/RepoScan_NOTICE.md')
          )
          foreach ($pair in $required) {
            if (-not (Test-Path -LiteralPath $pair[0])) { throw "Missing legal attribution: $($pair[0])" }
            Copy-Item -LiteralPath $pair[0] -Destination $pair[1] -Force
            if ((Get-Item -LiteralPath $pair[1]).Length -eq 0) { throw "Empty legal attribution: $($pair[1])" }
          }
          Write-Host 'All pinned module licenses and notices staged for installer'
      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          # Do not silently install an unreviewed package manager dependency in release CI.
          # Pin the installed runner image or fail and obtain maintainer approval instead.
          if (-not (Test-Path $iscc)) { throw 'Inno Setup unavailable' }
          & $iscc installer/OTS-Security-Suite.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Get-FileHash artifacts/*.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $(Split-Path -Leaf $_.Path)" } | Set-Content artifacts/SHA256SUMS.txt
          Get-Content artifacts/SHA256SUMS.txt | Write-Host
      - name: Smoke test installed Windows suite and local engine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $engine = (Resolve-Path 'bundle/engines/OTSScannerEngine.exe').Path
          $out = Join-Path $env:TEMP 'ots-suite-engine-stdout.txt'
          $err = Join-Path $env:TEMP 'ots-suite-engine-stderr.txt'
          $proc = Start-Process -FilePath $engine -ArgumentList @('--no-browser','--ephemeral','--print-url') -PassThru -RedirectStandardOutput $out -RedirectStandardError $err -WindowStyle Hidden
          try {
            $url = ''
            for ($i=0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 250
              if (Test-Path $out) {
                $line = Get-Content $out -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($line -like 'OTS_SCAN_URL=http://127.0.0.1:*') { $url = $line.Substring(13); break }
              }
              if ($proc.HasExited) { throw 'Scanner engine exited before becoming ready' }
            }
            if (-not $url) { throw 'Scanner engine failed to report a session URL' }
            $session = New-Object Microsoft.PowerShell.Commands.WebRequestSession
            $response = Invoke-WebRequest -Uri $url -WebSession $session -MaximumRedirection 4
            if ($response.StatusCode -ne 200) { throw 'Engine session page inaccessible' }
            $origin = ([uri]$url).GetLeftPart([System.UriPartial]::Authority)
            $info = Invoke-RestMethod -Uri "$origin/api/info" -WebSession $session
            if ($info.rule_count -lt 95) { throw 'Unexpected scanner rule count' }
            Write-Host "Go engine session and $($info.rule_count) rules verified"
          }
          finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }
          # Synthetic preservation canary verifies that uninstall never destroys
          # a user's existing per-profile encrypted quarantine data.
          $vaultRoot = Join-Path $env:LOCALAPPDATA 'OTSSystemSanitizer\Quarantine'
          New-Item -ItemType Directory -Force -Path $vaultRoot | Out-Null
          $vaultCanary = Join-Path $vaultRoot ("ots-ci-preserve-" + [Guid]::NewGuid().ToString('N') + '.txt')
          [System.IO.File]::WriteAllText($vaultCanary, 'synthetic-quarantine-preservation-check')
          $installer = (Resolve-Path 'artifacts/OTS-Security-Suite-Setup-x64.exe').Path
          $expected = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash
          & pwsh -NoProfile -File tools/verify-windows-release.ps1 -InstallerPath $installer -ExpectedSha256 $expected
          if ($LASTEXITCODE -ne 0) { throw 'Installer validation failed' }
          $stream = [System.IO.File]::OpenRead($installer)
          try {
            if ($stream.ReadByte() -ne 77 -or $stream.ReadByte() -ne 90) {
              throw 'Inno Setup output is not a genuine PE executable (MZ missing)'
            }
          }
          finally { $stream.Dispose() }
          $setup = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-') -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Silent setup failed: exit $($setup.ExitCode)" }
          $installPath = Join-Path $env:LOCALAPPDATA 'Programs/Ohana Tech Solutions/Security Suite'
          foreach ($required in @('OTSSecuritySuite.exe','engines/OTSScannerEngine.exe','engines/OTSWhiteAudit.exe','engines/OTSSystemSanitizer.exe','extension/manifest.json','extension/popup.js','licenses/OTS_WHITE_LICENSE.txt','licenses/OTS_WHITE_THIRD_PARTY_NOTICES.md','licenses/OTS_System_Sanitizer_LICENSE.txt','licenses/OTS_System_Sanitizer_THIRD_PARTY_NOTICES.md','licenses/RepoScan_NOTICE.md')) {
            if (-not (Test-Path (Join-Path $installPath $required))) { throw "Installer missing $required" }
          }
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon((Join-Path $installPath 'OTSSecuritySuite.exe'))
          if ($null -eq $icon) { throw 'Native host icon is missing' }
          $icon.Dispose()
          $desktopExe = Join-Path $installPath 'OTSSecuritySuite.exe'
          # Non-destructive preflight is compatible with built-in Windows PowerShell.
          $preflightPath = Join-Path $env:TEMP ('ots-suite-qa-' + [Guid]::NewGuid().ToString('N') + '.json')
          & powershell.exe -NoProfile -File tools/collect-windows-qa.ps1 -OutputPath $preflightPath
          if ($LASTEXITCODE -ne 0) { throw 'Read-only Windows QA preflight did not complete' }
          $preflight = Get-Content -LiteralPath $preflightPath -Raw | ConvertFrom-Json
          if (-not $preflight.application.installed -or
              -not $preflight.application.native_protocol_targets_suite -or
              -not $preflight.windows.build) { throw 'QA preflight reported a missing installed-app gate' }
          Remove-Item -LiteralPath $preflightPath -Force
          Write-Host 'Windows PowerShell read-only install/protocol QA preflight verified'
          $desktop = Start-Process -FilePath $desktopExe -PassThru
          try {
            Start-Sleep -Seconds 7
            $desktop.Refresh()
            if ($desktop.HasExited) { throw "Installed WPF suite exited unexpectedly (code $($desktop.ExitCode))" }
            Write-Host "Installed WPF suite stayed alive after launch (PID $($desktop.Id))"
            if ($desktop.MainWindowHandle -ne [IntPtr]::Zero) {
              & pwsh -NoProfile -File tools/windows-ui-smoke.ps1 -WindowHandle $desktop.MainWindowHandle.ToInt64()
              if ($LASTEXITCODE -ne 0) { throw 'Installed WPF navigation/WHITE UI smoke failed' }
              $closed = $desktop.CloseMainWindow()
              if (-not $closed -or -not $desktop.WaitForExit(15000)) {
                throw 'Installed WPF suite did not close gracefully on window-close request'
              }
              Start-Sleep -Seconds 2
              $survivors = @(Get-CimInstance Win32_Process -Filter "Name='OTSScannerEngine.exe'" | Where-Object { $_.ParentProcessId -eq $desktop.Id })
              if ($survivors.Count -ne 0) { throw 'Embedded scanner engine survived normal window close' }
              Write-Host 'Suite window close and immediate child-process cleanup verified'
            } else {
              Write-Host 'LIMITATION: CI session has no interactive main-window handle; GUI close and taskbar visuals NOT RUN'
            }
          }
          finally {
            $desktop.Refresh()
            if (-not $desktop.HasExited) { Stop-Process -Id $desktop.Id -Force }
            # CI cleanup only: a forced host kill does not exercise OnWindowClosing.
            Get-CimInstance Win32_Process -Filter "Name='OTSScannerEngine.exe'" |
              Where-Object { $_.ParentProcessId -eq $desktop.Id } |
              ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
            $desktop.Dispose()
          }
          $protocolKey = Get-Item 'HKCU:\Software\Classes\ots-security\\shell\\open\\command' -ErrorAction Stop
          if (-not ($protocolKey.GetValue('') -like '*OTSSecuritySuite.exe*')) {
            throw 'Installed custom URL protocol command is missing or incorrect'
          }
          # Safe same-version repair: reinstall over the existing closed app.
          $repair = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-') -Wait -PassThru
          if ($repair.ExitCode -ne 0 -or -not (Test-Path $desktopExe)) { throw 'Same-version reinstall failed' }
          if (-not (Test-Path $vaultCanary) -or
              ([System.IO.File]::ReadAllText($vaultCanary) -ne 'synthetic-quarantine-preservation-check')) {
            throw 'Same-version repair damaged user quarantine data'
          }
          Write-Host 'Same-version silent repair and quarantine retention verified'
          $uninstall = Join-Path $installPath 'unins000.exe'
          if (-not (Test-Path $uninstall)) { throw 'Inno uninstaller is missing' }
          $remove = Start-Process -FilePath $uninstall -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($remove.ExitCode -ne 0) { throw "Silent uninstall failed: exit $($remove.ExitCode)" }
          if (Test-Path 'HKCU:\Software\Classes\ots-security') { throw 'Uninstall left custom protocol registration behind' }
          if (Test-Path $desktopExe) { throw 'Uninstall left main EXE behind' }
          if ((-not (Test-Path $vaultCanary)) -or
              ([System.IO.File]::ReadAllText($vaultCanary) -ne 'synthetic-quarantine-preservation-check')) {
            throw 'Install/uninstall unexpectedly damaged existing user quarantine data'
          }
          Remove-Item -LiteralPath $vaultCanary -Force
          Write-Host 'Synthetic user-vault preservation through install/uninstall verified'
          Write-Host 'Installer, bundled modules, icon, URI registration and uninstaller smoke checks passed'
      - name: Upload Windows installer (unsigned test build)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OTS-Security-Suite-Windows-Beta
          path: |
            artifacts/*.exe
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7